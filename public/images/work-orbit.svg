<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid slice">
  <rect width="1200" height="750" fill="#101010"/>
  <!-- concept: dark-mode product interface, strict hierarchy -->
  <rect x="80" y="70" width="1040" height="610" rx="10" fill="#1a1a1a" stroke="#F4F4F0" stroke-opacity="0.08"/>
  <rect x="80" y="70" width="1040" height="54" rx="10" fill="#101010" stroke="#F4F4F0" stroke-opacity="0.08"/>
  <circle cx="112" cy="97" r="7" fill="#F1ED28"/>
  <rect x="140" y="90" width="180" height="14" rx="7" fill="#F4F4F0" opacity="0.25"/>
  <rect x="1080" y="88" width="24" height="18" rx="4" fill="#F1ED28"/>
  <!-- sidebar -->
  <rect x="80" y="124" width="220" height="556" fill="#101010"/>
  <rect x="110" y="160" width="140" height="12" rx="6" fill="#F4F4F0" opacity="0.3"/>
