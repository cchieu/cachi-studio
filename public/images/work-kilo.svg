<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <rect width="800" height="1000" fill="#101010"/>
  <!-- concept: modular editorial identity, swiss grid, electric accent -->
  <g transform="rotate(4 420 610)">
    <rect x="240" y="330" width="400" height="540" fill="#101010" stroke="#F4F4F0" stroke-opacity="0.25" stroke-width="1.5"/>
  </g>
  <g transform="rotate(-4 400 520)">
    <rect x="180" y="240" width="440" height="580" fill="#F4F4F0"/>
    <rect x="180" y="240" width="440" height="130" fill="#101010"/>
    <rect x="216" y="300" width="150" height="10" fill="#F1ED28"/>
    <rect x="216" y="330" width="90" height="10" fill="#858585"/>
    <circle cx="560" cy="740" r="86" fill="#F1ED28"/>
    <circle cx="560" cy="740" r="34" fill="#101010"/>
    <rect x="216" y="420" width="250" height="16" fill="#101010"/>
    <rect x="216" y="462" width="300" height="7" fill="#858585"/>
    <rect x="216" y="484" width="200" height="7" fill="#858585"/>
    <rect x="216" y="506" width="260" height="7" fill="#858585"/>
    <rect x="216" y="560" width="70" height="70" fill="#101010"/>
    <rect x="306" y="560" width="70" height="70" fill="#101010" fill-opacity="0.15"/>
    <rect x="396" y="560" width="70" height="70" fill="#101010"/>
    <rect x="216" y="660" width="150" height="7" fill="#858585"/>
    <rect x="216" y="682" width="110" height="7" fill="#858585"/>
  </g>
  <!-- dot matrix -->
  <g fill="#F4F4F0" opacity="0.22">
    <circle cx="90" cy="120" r="3"/><circle cx="130" cy="120" r="3"/><circle cx="170" cy="120" r="3"/>
    <circle cx="90" cy="160" r="3"/><circle cx="130" cy="160" r="3"/><circle cx="170" cy="160" r="3"/>
    <circle cx="90" cy="200" r="3"/><circle cx="130" cy="200" r="3"/><circle cx="170" cy="200" r="3"/>
  </g>
  <circle cx="700" cy="130" r="60" fill="none" stroke="#F1ED28" stroke-width="2" stroke-dasharray="4 8"/>
  <rect x="0" y="940" width="800" height="4" fill="#F1ED28"/>
</svg>
