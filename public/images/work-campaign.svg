<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#F1ED28" stop-opacity="0.5"/>
      <stop offset="35%" stop-color="#F1ED28" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#101010" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101010" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="blur18"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="800" height="1000" fill="#0b0b0b"/>
  <rect width="800" height="1000" fill="url(#glow)"/>
  <!-- pedestal -->
  <polygon points="300,760 500,760 520,980 280,980" fill="#1c1c1c"/>
  <polygon points="300,760 500,760 505,775 295,775" fill="#2a2a2a"/>
  <!-- glowing ring -->
  <circle cx="400" cy="430" r="170" fill="none" stroke="#F1ED28" stroke-width="26" filter="url(#blur18)" opacity="0.85"/>
  <circle cx="400" cy="430" r="170" fill="none" stroke="#F1ED28" stroke-width="10" filter="url(#blur6)"/>
  <circle cx="400" cy="430" r="170" fill="none" stroke="#F1ED28" stroke-width="4"/>
  <!-- sculpture -->
  <ellipse cx="400" cy="740" rx="120" ry="26" fill="#000000" opacity="0.6"/>
  <rect x="386" y="560" width="28" height="180" rx="14" fill="#3a3a3a"/>
  <circle cx="400" cy="545" r="44" fill="#242424"/>
  <circle cx="400" cy="545" r="44" fill="none" stroke="#F1ED28" stroke-opacity="0.25" stroke-width="2"/>
  <!-- reflection -->
  <ellipse cx="400" cy="806" rx="150" ry="18" fill="#F1ED28" opacity="0.08" filter="url(#blur6)"/>
  <rect y="640" width="800" height="360" fill="url(#fog)"/>
</svg>
